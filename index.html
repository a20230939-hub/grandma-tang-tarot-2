:root{--cream:#F4EBDD;--brown:#37271F;--khaki:#86624F;--coral:#B66C56;--white:#FFFDF9}

d:"遇到有好感的人，妳不一定會立刻行動。妳會留意對方說話的方式、相處時的細節，以及他的行動是否一致。\n妳比較不容易因為一時心動，就把全部心思放在對方身上。",

q:"妳觀察了一陣子，還是不確定他是否也想靠近？"}};

/* 主要＋次要 補充句（12 種組合）*/
const MIX={
CI:"妳可能一開始很怕主動，但一旦確定自己喜歡，就會很願意付出。",
CB:"妳平常會想很多，但心裡其實有一股想把話說清楚的力氣，只是需要多一點安全感。",
CS:"妳習慣先觀察、先收著，容易把心意藏很久，也讓對方不容易讀懂妳。",
IC:"妳很願意為對方努力，但付出時也會偷偷在意：這樣會不會太多、他會不會有壓力。",
IB:"妳有行動力，也敢表達，只是熱情上來時，記得留一點空間給對方跟上。",
IS:"妳會付出，也會默默衡量對方的回應，有時心裡的投入和表面的步調並不一致。",
BC:"妳多半敢表達，但遇到特別在意的人，還是會忽然變得小心，怕說錯一句話。",
BI:"妳敢說也敢做，有時還會一路多做一點，記得讓對方也有機會走向妳。",
BS:"妳會直接表達，也懂得觀察，所以能在行動與看清楚之間抓到不錯的平衡。",
SC:"妳先觀察，也容易擔心被拒絕，所以好感常常停在心裡，沒有被對方看見。",
SI:"妳平常步調慢，但一旦信任對方，就會慢慢投入、願意為關係多做一些。",
SB:"妳通常先看清楚，等有把握時，也會願意坦率說出自己的想法。"};

/* ========== 計分邏輯（純函式，可測試）========== */
function compute(a){
  const c={C:0,I:0,B:0,S:0};a.forEach(t=>c[t]++);
  const max=Math.max(...TYPES.map(t=>c[t]));
  const top=TYPES.filter(t=>c[t]===max);
  if(top.length>=3)return{kind:"multi",top,c};
  if(top.length===2)return{kind:"dual",top,c};
  const rest=TYPES.filter(t=>t!==top[0]).sort((x,y)=>c[y]-c[x]);
  return{kind:"single",top,c,second:c[rest[0]]>=2?rest[0]:null};
}

/* ========== 分享圖 ========== */
function wrap(x,t,w){const L=[];t.split("\n").forEach(p=>{let l="";for(const ch of p){if(x.measureText(l+ch).width>w){L.push(l);l=ch}else l+=ch}L.push(l)});return L}
async function makeCanvas(){
 if(document.fonts&&document.fonts.ready)await document.fonts.ready;
 const c=document.createElement("canvas");c.width=1080;c.height=1920;const x=c.getContext("2d");
 const F='"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif',i=info();
 x.fillStyle=COLORS.cream;x.fillRect(0,0,1080,1920);
 x.strokeStyle=COLORS.khaki;x.lineWidth=2;x.strokeRect(60,60,960,1800);
 x.textAlign="center";x.textBaseline="top";
 const T=(s,y,sz,col,wt,w=800,lh=1.5)=>{x.font=`${wt} ${sz}px ${F}`;x.fillStyle=col;let yy=y;wrap(x,s,w).forEach(l=>{x.fillText(l,540,yy);yy+=sz*lh});return yy};
 let lg=null;if(LOGO_SRC)lg=await new Promise(q=>{const m=new Image();m.onload=()=>q(m);m.onerror=()=>q(null);m.src=LOGO_SRC});
 if(lg){const h=90,w=lg.width/lg.height*h;x.drawImage(lg,540-w/2,120,w,h)}else T(BRAND.name,150,36,COLORS.khaki,"400");
 let y=T(BRAND.title,230,68,COLORS.brown,"700");
 x.fillStyle=COLORS.coral;x.fillRect(480,y+30,120,4);
 y=T(i.name,y+110,56,COLORS.coral,"700");
 x.fillStyle=COLORS.white;x.fillRect(120,y+60,840,520);
 let y2=T(i.title,y+110,50,COLORS.brown,"700",740,1.55);
 T("婆婆提醒："+i.tip,y2+50,38,COLORS.khaki,"400",740,1.6);
 T(BRAND.slogan,1560,40,COLORS.brown,"600");
 T(BRAND.ig,1650,36,COLORS.coral,"400");
 return c}
function ov(h){const o=document.getElementById("ov");o.innerHTML=h+'<button class="btn" id="cl" style="background:#fff">關閉</button>';o.style.display="block";document.getElementById("cl").onclick=()=>o.style.display="none"}
async function save(){
 const b=document.getElementById("sv");b.disabled=true;b.textContent="產生圖片中…";
 try{const c=await makeCanvas();
  const blob=await new Promise(r=>c.toBlob(r,"image/png")),url=c.toDataURL("image/png");
  b.disabled=false;b.textContent="儲存我的結果 📷";
  const f=new File([blob],"grandma-tang-quiz.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:BRAND.title});return}catch(e){if(e.name==="AbortError")return}}
  ov(`<p>手機請長按圖片儲存；電腦可按下方下載</p><img src="${url}" alt="結果圖片"><a class="btn pri" href="${url}" download="grandma-tang-quiz.png">下載 PNG</a>`)
 }catch(e){b.disabled=false;b.textContent="儲存我的結果 📷";alert("圖片產生失敗，請換個瀏覽器（如 Safari／Chrome）再試。")}}

 ["四型各自最高",k("BBBBCI").kind==="single"&&k("BBBBCI").top[0]==="B"&&k("CCCIIS").kind==="single"&&k("SSSSSI").top[0]==="S"],

 app.innerHTML="<h2>自我測試</h2>"+t.map(x=>`<p>${x[1]?"✅":"❌"} ${x[0]}</p>`).join("")}
